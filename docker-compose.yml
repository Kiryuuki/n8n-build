services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION:-2.19.5}
    image: n8n-playwright:local
    container_name: n8n-playwright
    restart: unless-stopped
    env_file: .env
    ports:
      - "5678:5678"
      - "9222:9222"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/files
    # Chromium renderer uses shared memory — default Docker 64MB causes crashes
    shm_size: "256mb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:
  n8n_files: