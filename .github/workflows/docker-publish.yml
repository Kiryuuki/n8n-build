name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version to build'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/n8n-playwright

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve version: workflow_dispatch input > repo variable > hardcoded default
      - name: Resolve n8n version
        id: version
        run: |
          VERSION="${{ github.event.inputs.n8n_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ vars.N8N_VERSION }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="2.19.5"
          fi
          echo "n8n_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building n8n version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=n8n-${{ steps.version.outputs.n8n_version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Build for both amd64 and arm64 (Proxmox/VPS compatibility)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            N8N_VERSION=${{ steps.version.outputs.n8n_version }}
          # Cache layers in GHCR for faster rebuilds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max