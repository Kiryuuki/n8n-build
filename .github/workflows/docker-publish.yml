name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version to build'
        required: false
        default: ''

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires all-lowercase owner name
      - name: Set image name
        id: image
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${OWNER}/n8n-playwright" >> $GITHUB_OUTPUT

      # Priority: workflow input > repo variable > hardcoded default
      - name: Resolve n8n version
        id: version
        run: |
          VERSION="${{ github.event.inputs.n8n_version }}"
          [ -z "$VERSION" ] && VERSION="${{ vars.N8N_VERSION }}"
          [ -z "$VERSION" ] && VERSION="2.19.5"
          echo "n8n_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building n8n@$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.full }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=n8n-${{ steps.version.outputs.n8n_version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            N8N_VERSION=${{ steps.version.outputs.n8n_version }}
          cache-from: type=registry,ref=${{ steps.image.outputs.full }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.full }}:buildcache,mode=max